<aside class="mode-panel files-panel files-browser-panel"
       data-mode="files"
       x-data="filesBrowserPanel()"
       x-show="$store.mode.active === 'files'"
       x-transition.opacity.duration.200ms>

    <div class="panel-head files-browser-head">
        <div>
            <div class="panel-title">Files</div>
            <div class="panel-subtitle">Browse the attached workspace. Editing stays in your normal development environment.</div>
        </div>
        <button class="files-refresh" @click="$store.files.refreshTree()" title="Refresh workspace" aria-label="Refresh workspace">↻</button>
    </div>

    <template x-if="!$store.files.roots.length && !$store.files.loading && !$store.files.error">
        <div class="files-empty">
            <div class="files-empty-title">No workspace attached</div>
            <p class="muted">Attach a folder to browse its structure.</p>
            <button class="primary" @click="attachWorkspace()" title="Pick a workspace folder">Attach folder</button>
        </div>
    </template>

    <div class="files-error" x-show="$store.files.error" x-text="$store.files.error"></div>

    <div class="files-browser" x-show="$store.files.roots.length || $store.files.loading">
        <div class="files-loading muted ui-loading-region" x-show="$store.files.loading">Loading workspace…</div>
        <div class="files-tree" x-show="!$store.files.loading">
            <template x-for="root in $store.files.roots" :key="root.path">
                <section class="files-root">
                    <div class="files-root-label mono" x-text="root.path" :title="root.path"></div>
                    <template x-for="child in root.children" :key="child.path">
                        <div class="files-entry-wrap">
                            <template x-if="child.is_dir">
                                <button class="files-entry dir"
                                        :class="{ selected: $store.files.selectedPath === child.path }"
                                        @click="$store.files.selectedPath = child.path; $store.files.expand(child.path)"
                                        :title="child.path">
                                    <span class="files-entry-chevron" x-text="$store.files.expanded[child.path] ? '⌄' : '›'"></span>
                                    <svg class="files-entry-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5h7l2 2H21v8.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7.5Z"></path><path d="M3 7.5V6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1.5"></path></svg>
                                    <span class="name" x-text="child.name"></span>
                                </button>
                            </template>
                            <template x-if="!child.is_dir">
                                <button class="files-entry file"
                                        :class="{ selected: $store.files.selectedPath === child.path }"
                                        @click="$store.files.selectedPath = child.path"
                                        :title="child.path">
                                    <span class="files-entry-chevron"></span>
                                    <svg class="files-entry-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"></path><path d="M14 2v6h6"></path></svg>
                                    <span class="name" x-text="child.name"></span>
                                </button>
                            </template>

                            <template x-if="child.is_dir && $store.files.expanded[child.path]">
                                <div class="files-subtree">
                                    <template x-for="sub in (child.children || [])" :key="sub.path">
                                        <div class="files-entry-wrap">
                                            <template x-if="sub.is_dir">
                                                <button class="files-entry dir indent"
                                                        :class="{ selected: $store.files.selectedPath === sub.path }"
                                                        @click="$store.files.selectedPath = sub.path; $store.files.expand(sub.path)"
                                                        :title="sub.path">
                                                    <span class="files-entry-chevron" x-text="$store.files.expanded[sub.path] ? '⌄' : '›'"></span>
                                                    <svg class="files-entry-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5h7l2 2H21v8.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7.5Z"></path><path d="M3 7.5V6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1.5"></path></svg>
                                                    <span class="name" x-text="sub.name"></span>
                                                </button>
                                            </template>
                                            <template x-if="!sub.is_dir">
                                                <button class="files-entry file indent"
                                                        :class="{ selected: $store.files.selectedPath === sub.path }"
                                                        @click="$store.files.selectedPath = sub.path"
                                                        :title="sub.path">
                                                    <span class="files-entry-chevron"></span>
                                                    <svg class="files-entry-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"></path><path d="M14 2v6h6"></path></svg>
                                                    <span class="name" x-text="sub.name"></span>
                                                </button>
                                            </template>
                                        </div>
                                    </template>
                                    <div class="files-entry files-empty-directory muted indent" x-show="(child.children || []).length === 0">Empty folder</div>
                                </div>
                            </template>
                        </div>
                    </template>
                </section>
            </template>
        </div>
    </div>
</aside>

<script>
function filesBrowserPanel() {
    return {
        async attachWorkspace() {
            Alpine.store("fileBrowser").show("folder", async (path) => {
                const response = await fetch("/api/workspace", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ path }),
                });
                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    Alpine.store("toast").show(data.detail || "Could not attach workspace", "error");
                    return;
                }
                await Alpine.store("files").load();
                await Alpine.store("inspector").loadWorkspace();
            });
        },
    };
}
</script>
